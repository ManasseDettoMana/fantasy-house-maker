<div class="content d-flex flex-column justify-content-center align-items-center">
  <form [formGroup]="newCasataForm" (ngSubmit)="onSubmit()" class="card">
      <div class="card-body">
        <div class="mb-5">
            <input type="text" id="nome" formControlName="nome" placeholder="Nome della casata...">
        </div>
        <div class="mb-5">
            <input type="text" id="motto" formControlName="motto" placeholder="Motto della casata...">
        </div>
        <div class="mb-5">
            <input type="text" id="stemma" formControlName="stemma" placeholder="Stemma della casata...">
        </div>
      </div>
      <div class="d-flex justify-content-center py-3">
      <button type="submit" class="btn btn-primary" [disabled]="isLoading()">
        {{ isLoading() ? 'Caricamento...' : 'Invia' }}
      </button>
    </div>
  </form>
    @if (errorMessage()) {
    <div class="alert-wrapper">
      <app-alert-closeable errorMessage="{{ errorMessage() }}" />
    </div>
  }
</div>
