<div class="d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">

  <form [formGroup]="newCasataForm" (ngSubmit)="onSubmit()" class="card shadow-sm" style="min-width: 360px;">
    <div class="card-body d-flex flex-column gap-3 p-4">
      <input type="text" id="nome" formControlName="nome" placeholder="Nome della casata..." class="form-control form-control-lg">
      <input type="text" id="motto" formControlName="motto" placeholder="Motto della casata..." class="form-control form-control-lg">
      <input type="text" id="stemma" formControlName="stemma" placeholder="Stemma della casata..." class="form-control form-control-lg">
    </div>
    <div class="card-footer border-0 bg-transparent pb-4">
      <div class="d-flex align-items-center">
        <div class="flex-fill text-start">
          <button type="button" class="btn btn-secondary" aria-label="indietro" (click)="goToDashboard()">
            <i class="pi pi-angle-double-left"></i>
          </button>
        </div>
        <div class="flex-fill text-center">
          <button type="submit" class="btn btn-primary px-5" [disabled]="isLoading()">
            {{ isLoading() ? 'Caricamento...' : 'Invia' }}
          </button>
        </div>
        <div class="flex-fill"></div>
      </div>
    </div>
  </form>

  @if (errorMessage()) {
    <div class="mt-3 w-100 px-3">
      <app-alert-closeable errorMessage="{{ errorMessage() }}" />
    </div>
  }
</div>
