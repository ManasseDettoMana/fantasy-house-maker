@if (isLoading()) {
  <div class="card d-flex justify-content-center align-items-center dashboard container">
    <p-progress-spinner ariaLabel="loading" />
  </div>
}

@if (errorMessage()) {
  <p class="text-red-500">{{ errorMessage() }}</p>
}

@if (!isLoading()) {
  <div class="container dashboard">
    <div class="d-flex justify-content-end mb-3">
      <p-button (click)="goToNewPersonaggioForm()" (keyup.enter)="goToNewPersonaggioForm()">
        <i class="pi pi-plus"></i>Nuovo Personaggio
      </p-button>
    </div>

    <p-table [value]="personaggi()" [tableStyle]="{ 'min-width': '60rem' }">
      <ng-template #header>
        <tr>
          <th pSortableColumn="id" style="width:20%;">
            <div class="flex items-center gap-2">
              # <p-sortIcon field="id" />
            </div>
          </th>
          <th pSortableColumn="nome" style="width:20%">
            <div class="flex items-center gap-2">
              Nome <p-sortIcon field="nome" />
            </div>
          </th>
          <th pSortableColumn="casata" style="width:20%">
            <div class="flex items-center gap-2">
              Casata <p-sortIcon field="casata" />
            </div>
          </th>
          <th style="width:20%">
            <div class="flex items-center gap-2">
              Azioni
            </div>
          </th>
        </tr>
      </ng-template>
      <ng-template #body let-personaggio let-rowIndex="rowIndex">
        <tr>
          <td>{{rowIndex + 1}}</td>
          <td>{{personaggio.nome}}</td>
          <td>{{personaggio.casataNome}}</td>
          <td>
            <p-button severity="warn" [outlined]="true" (click)="goToUpdatePersonaggioForm(personaggio.id)">
              <i class="bi bi-pencil"></i>
            </p-button>
            <mana-delete-button
              (confermato)="eliminaPersonaggio(personaggio.id)">
              >
            </mana-delete-button>
            <p-button severity="info" [outlined]="true" >
              <i class="bi bi-eye"></i>
            </p-button>
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
}
