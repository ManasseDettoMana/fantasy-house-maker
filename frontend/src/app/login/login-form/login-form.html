<div class="d-flex flex-column justify-content-center align-items-center min-vh-100 py-4">
  <h4 class="mb-3">Login</h4>
  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="card shadow-sm" style="min-width: 360px;">
    <div class="card-body d-flex flex-column gap-3 p-4">
      <p-floatlabel>
        <input
            pInputText
            id="username"
            type="text"
            formControlName="username"
            class="w-100"
            autocomplete="off"
          /> 
        <label for="username">Username</label>
      </p-floatlabel>
      <p-floatlabel class="mt-3">
        <p-password
          inputId="password"
          styleClass="w-100"
          [fluid]="true"
          [toggleMask]="true"
          [feedback]="false"
          autocomplete="off"
          formControlName="password" />
        <label for="password">Password</label>
      </p-floatlabel>
      <!-- <p-floatlabel class="mt-3">
        <input pInputText [type]="typeInputPassword()" id="password" formControlName="password">
        <label for="password">Password</label>
        <button type="button" (click)="togglePassword()"><i [class]="eyePassword()" aria-label="eye"></i></button>
      </p-floatlabel> -->
    </div>
    <div class="card-footer border-0 bg-transparent pb-4 text-center">
      <button type="submit" class="btn btn-primary" [disabled]="isLoading() || loginForm.invalid">
        {{ isLoading() ? 'Caricamento...' : 'Accedi' }}
      </button>
    </div>
  </form>

  @if (errorMessage()) {
    <div class="mt-3 w-100 px-3">
      <app-alert-closeable errorMessage="{{ errorMessage() }}" />
    </div>
  }
</div>
